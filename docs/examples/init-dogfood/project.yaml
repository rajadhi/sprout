# Sprout project profile.
# Created by /sprout:init. Lives at .sprout/project.yaml in the downstream repo.
# Unknown values are allowed — write `unknown`, never invent a value.

schema_version: 1

name: recipe-box
purpose: "Save and organize family recipes; eventually generate a shopping list from a week's chosen recipes."

platforms: [web]
technology_stack: unknown
repository: unknown
deployment_environments: []
testing_approach: unknown
accessibility_target: "WCAG 2.2 AA"
security_privacy_constraints: unknown

# --- Policy (§40-41 of docs/protocol.md) ---
# Risk classes gate how much autonomy an agent has without a human.
# Override per-project; these are the shipped defaults. Not overridden here — no reason
# surfaced during init to change them for a small personal project.
autonomy_policy:
  R0:
    description: documentation / trivial changes
    approval: autonomous
  R1:
    description: isolated low-risk behaviour
    approval: autonomous_after_verification
  R2:
    description: meaningful business logic / data behaviour
    approval: autonomous_implementation_plus_independent_verification
  R3:
    description: security / privacy / auth / major architecture / migration
    approval: human_required
  R4:
    description: destructive production or high-consequence operations
    approval: human_controlled

task_sizing_policy:
  sizes: [XS, S, M, L, XL]
  decompose_at: L
  autonomous_ceiling: L

verification_policy:
  mandatory_checks: [lint, unit]
  conditional_checks: [integration, contract, build, deploy, security, runtime, computer_use, visual, review]
  # technology_stack is unknown, so exact tool versions/commands are not yet confirmed — verify
  # skill will need to detect the real toolchain the first time it's actually invoked, once the
  # developer picks a stack. init does not invent one.

evidence_policy:
  always_redact: [api_keys, bearer_tokens, cookies, passwords, credentials, sensitive_personal_data]
  minimum_required: task_defines

merge_policy:
  requires: [task_state_verified, required_evidence_exists, required_ci_checks_pass, required_approvals_exist, branch_protection_passes]
  # GitHub conventions (labels, branch protection) not yet established — repository: is unknown,
  # there is no remote to configure yet. See init's completion report.

production_approval_policy: human_required

created_at: "2026-08-19"
sprout_version: 0.1.0
