name: Sprout Merge Readiness

# Invokes skills/merge-readiness/SKILL.md headlessly via anthropics/claude-code-action, gating
# merge on whether a PR's claimed task is actually VERIFIED, bound to this exact commit, and
# covers the project's mandatory checks -- see the skill file for what's being checked and why.
#
# This is deliberately an LLM-judgment gate, not a deterministic script (see the skill's own
# "This is an LLM-judgment gate, not a deterministic one" note). It requires ANTHROPIC_API_KEY (or
# CLAUDE_CODE_OAUTH_TOKEN) configured as a repository secret to run.
#
# Downstream repos that install the Sprout plugin get skills/merge-readiness/SKILL.md for free;
# copy this workflow file into .github/workflows/ there too (skills/init/SKILL.md offers this) --
# a GitHub Actions workflow only runs from the repo it lives in, not from an installed plugin.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge-readiness:
    runs-on: ubuntu-latest
    # id-token: write lets claude-code-action fall back to OIDC-based auth when no
    # ANTHROPIC_API_KEY/CLAUDE_CODE_OAUTH_TOKEN secret is configured; without it the action fails
    # with an opaque "Could not fetch an OIDC token" error rather than a clear auth message.
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask Claude to judge merge readiness
        id: readiness
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow skills/merge-readiness/SKILL.md exactly against this pull request:
            base commit ${{ github.event.pull_request.base.sha }}, head commit
            ${{ github.event.pull_request.head.sha }}, PR number
            ${{ github.event.pull_request.number }}. This is a read-only judgment -- do not edit
            any file. Return your verdict as the structured output the skill's step 6 describes.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*)"
            --json-schema '{"type":"object","properties":{"merge_ready":{"type":"boolean"},"reasons":{"type":"array","items":{"type":"string"}}},"required":["merge_ready","reasons"]}'

      # A one-line gate on the structured verdict above -- not enforcement logic of its own, just
      # how a GitHub Actions job turns a boolean into pass/fail. Everything that actually decides
      # merge_ready lives in the skill, not here.
      - name: Enforce verdict
        run: |
          echo '${{ steps.readiness.outputs.structured_output }}' | jq -r '.reasons[]' || true
          [ "$(echo '${{ steps.readiness.outputs.structured_output }}' | jq -r '.merge_ready')" = "true" ]
