name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin manifest and skill/agent frontmatter
        run: python3 .github/scripts/validate_structure.py

  toy-app-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/fixtures/toy-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run toy-app unit tests
        run: python3 -m unittest test_consent_store.py -v

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run immutability hook regression tests
        run: python3 -m unittest tests.hooks.test_check_immutable_artifacts -v

  risk-approval-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run R3/R4 approval-check regression tests
        run: python3 -m unittest tests.ci.test_check_risk_approval -v
      - name: Check every R3/R4 task has a real approved approval record
        run: python3 .github/scripts/check_risk_approval.py

  skill-scenario-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run skill/scenario coverage regression tests
        run: python3 -m unittest tests.ci.test_check_skill_scenario_coverage -v
      - name: Determine changed-file range for this event
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Check every changed skill touched a pressure scenario
        run: python3 .github/scripts/check_skill_scenario_coverage.py

  evidence-redaction-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run evidence redaction regression tests
        run: python3 -m unittest tests.ci.test_check_evidence_redaction -v
      - name: Check every evidence record is redacted with no obvious secrets
        run: python3 .github/scripts/check_evidence_redaction.py

  merge-readiness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run merge-readiness regression tests
        run: python3 -m unittest tests.ci.test_check_merge_readiness -v
      - name: Determine changed-file range for this event
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Check task/run/evidence binding and artifact transitions
        # PR_BODY goes through env:, never spliced into the run: script text -- a PR body is
        # attacker-controlled text and interpolating it directly into a shell block would be a
        # script-injection hole.
        env:
          SPROUT_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_merge_readiness.py

  plugin-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run plugin version bump regression tests
        run: python3 -m unittest tests.ci.test_check_plugin_version_bump -v
      - name: Determine changed-file range for this event
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Check significant plugin changes bump plugin.json's version
        run: python3 .github/scripts/check_plugin_version_bump.py
