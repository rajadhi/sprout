<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<style>
  /* DES-001-v1 "Visual hierarchy": quiet typography, generous whitespace, no chrome that reads
     as "app UI" over "journal page." DES-001-v1 "Empty state": "Nothing captured yet today."
     with a single unobtrusive prompt, not a hard empty box. */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf9f6;
    font-family: Georgia, "Iowan Old Style", serif;
    color: #2b2b28;
  }
  .page {
    max-width: 32rem;
    padding: 3rem 2rem;
    text-align: center;
  }
  .empty-text {
    font-size: 1.35rem;
    line-height: 1.6;
    color: #4a4a45;
    margin: 0 0 1.75rem 0;
  }
  .signal-prompt {
    font-size: 0.95rem;
    color: #8a8a80;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  .signal-prompt:focus-visible {
    outline: 2px solid #5b7a99;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <main class="page" role="main">
    <p class="empty-text" data-testid="empty-state-text">Nothing captured yet today.</p>
    <button class="signal-prompt" data-testid="enable-signal-prompt"
            aria-label="Enable a signal to start capturing your day">
      Enable a signal to get started
    </button>
  </main>
</body>
</html>
